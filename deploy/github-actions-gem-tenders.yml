name: GeM tender scan

# Copy this file to .github/workflows/gem-tenders.yml at the repository root.
# GitHub only reads workflows from that location.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Use offline sample tenders instead of live GeM data
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      export_sheet:
        description: Write results to Google Sheets
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan tenders
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          ARGS="--csv artifacts/tenders.csv"
          if [ "${{ inputs.sample }}" = "true" ]; then ARGS="$ARGS --sample"; fi
          if [ "${{ inputs.export_sheet }}" = "true" ]; then ARGS="$ARGS --sheet"; fi
          python -m backend.cli run $ARGS

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-tenders
          path: artifacts/tenders.csv
          if-no-files-found: ignore
